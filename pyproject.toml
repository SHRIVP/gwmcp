[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gwmcp"
version = "0.1.0"
description = "Guidewire PolicyCenter MCP server"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
gwmcp = "server:main"

[tool.hatch.build.targets.wheel]
include = ["server.py", "client.py"]
